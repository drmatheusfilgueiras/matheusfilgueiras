name: Verify agent readiness

on:
  push:
    branches:
      - "agent-readiness-*"
  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Diagnose lockfile dev dependency classification
        run: |
          cp package-lock.json /tmp/old-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a = JSON.parse(fs.readFileSync('/tmp/old-lock.json', 'utf8'));
          const b = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const changed = [];
          for (const [name, item] of Object.entries(b.packages)) {
            const before = a.packages[name];
            if (!before || before.version !== item.version || Boolean(before.dev) !== Boolean(item.dev) || Boolean(before.devOptional) !== Boolean(item.devOptional)) {
              changed.push({name, before: before && {version: before.version, dev: !!before.dev, devOptional: !!before.devOptional}, after: {version: item.version, dev: !!item.dev, devOptional: !!item.devOptional}});
            }
          }
          console.log('LOCK_CLASSIFICATION_DIFF=' + JSON.stringify(changed));
          NODE
          cp /tmp/old-lock.json package-lock.json
      - name: Audit production dependencies (diagnostic)
        run: npm audit --omit=dev --audit-level=low
        continue-on-error: true
      - name: Audit all dependencies (diagnostic)
        run: npm audit --audit-level=low
        continue-on-error: true
      - name: Pre-render site
        run: npm run build
      - name: Check public HTML and agent resources
        run: npm run test:agent
      - name: Check chat login and contact layout
        run: node --test tests/chat-auth-security.test.mjs
      - name: Check all PHP endpoints
        run: |
          php -l public/api/mcp.php
          php -l public/api/_chat-auth.php
          php -l public/api/chat-auth.php
          php -l public/api/chat-flow-config.php
          php -l public/api/chat-conversations.php
      - name: Test server-side chat authorization
        run: php tests/chat-auth-security.test.php
