name: Verify agent readiness

on:
  push:
    branches:
      - "agent-readiness-*"
  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Pre-render site
        run: npm run build
      - name: Check public HTML and agent resources
        run: npm run test:agent
      - name: Check chat login and contact layout
        run: node --test tests/chat-auth-security.test.mjs
      - name: Check all PHP endpoints
        run: |
          php -l public/api/mcp.php
          php -l public/api/_chat-auth.php
          php -l public/api/chat-auth.php
          php -l public/api/chat-flow-config.php
          php -l public/api/chat-conversations.php
      - name: Test server-side chat authorization
        run: php tests/chat-auth-security.test.php
